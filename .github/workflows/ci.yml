name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deno: ["v2.0.x", "v2.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      - run: deno fmt --check
      - run: deno lint
      - run: deno test --allow-env tests/
      - run: deno test --allow-env --allow-net --allow-read integration/
      - run: deno publish --dry-run --config jsr.json

  bun:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.1", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun test tests/
